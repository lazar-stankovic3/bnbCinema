<div class="ticket-page" *ngIf="ticket; else noTicket"><div class="ticket-actions"><button (click)="goMovies()">← Filmovi</button><button class="download" (click)="downloadPdf()">Preuzmi PDF <i class="fa-solid fa-download"></i></button></div><div class="ticket"><div class="ticket-main"><span class="eyebrow">KLIKNI FILM · DIGITALNA KARTA</span><h1>{{ticket.film.title}}</h1><div class="ticket-grid"><div><small>DATUM</small><strong>{{ticket.datum}}</strong></div><div><small>TERMIN</small><strong>{{ticket.termin}}</strong></div><div><small>SALA</small><strong>{{ticket.sala}}</strong></div><div><small>SEDIŠTA</small><strong>{{ticket.sedista.join(', ')}}</strong></div></div><div class="code">KOD REZERVACIJE <strong>{{ticket.kod}}</strong></div></div><div class="ticket-qr"><img [src]="qr" alt="QR kod rezervacije"><small>Prikažite ovaj kod na ulazu</small></div></div></div><ng-template #noTicket><div class="empty-ticket"><h2>Karta nije pronađena</h2><button (click)="goMovies()">Pogledaj filmove</button></div></ng-template>
